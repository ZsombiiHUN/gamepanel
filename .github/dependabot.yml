version: 2
# Minor and patch updates arrive as one pull request per ecosystem, so CI runs
# once for them; major updates still get their own pull request.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /docs
    schedule: {interval: monthly}
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/, /images/java]
    schedule: {interval: weekly}
    groups:
      minor-and-patch:
        update-types: [minor, patch]
