name: Scorecard
# OpenSSF Scorecard: checks the repository's supply-chain practices (branch
# protection, pinned dependencies, token permissions, signed releases, ...).
# Results go to Security → Code scanning and to the public Scorecard API that
# the badge in README.md reads. Both need a public repository, so this runs
# once the repository is public.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1" # weekly
  branch_protection_rule:
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish the results to the Scorecard API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
