name: Images
# Builds the gamepanel-java images that GamePanel's Minecraft eggs run on
# (images/java), and checks that the eggs match their generator.
on:
  push:
    branches: [main]
    paths: [images/**, eggs/**, scripts/minecraft-eggs.sh, .github/workflows/images.yml]
  pull_request:
    paths: [images/**, eggs/**, scripts/minecraft-eggs.sh, .github/workflows/images.yml]
  schedule:
    - cron: "17 4 * * 1" # weekly, to pick up Java and Ubuntu security updates
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck images/java/gp-java images/java/gp-install scripts/minecraft-eggs.sh
      - run: scripts/minecraft-eggs.sh --check
  java:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 17, 21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: images/java
          build-args: JAVA_VERSION=${{ matrix.java }}
          platforms: linux/amd64,linux/arm64
          pull: true # always the latest Temurin patch release
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/zsombiihun/gamepanel-java:${{ matrix.java }}
          cache-from: type=gha,scope=java-${{ matrix.java }}
          cache-to: type=gha,mode=max,scope=java-${{ matrix.java }}
      # The launcher must work on every Java it ships with (Java 8 reports "1.8").
      - name: Smoke test
        run: |
          docker buildx build --load --build-arg JAVA_VERSION=${{ matrix.java }} \
            --cache-from type=gha,scope=java-${{ matrix.java }} -t gp-java-test images/java
          docker run --rm gp-java-test sh -c 'java -version && command -v gp-java gp-install jq curl'
          # No server is installed, so Java exits right after gp-java prints its plan.
          out=$(docker run --rm -e SERVER_MEMORY=2048 -e SERVER_PORT=25565 -e EULA=true \
            -e JVM_PRETOUCH=0 gp-java-test 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q '\[gamepanel\] Java ${{ matrix.java }} | limit 2048 MB | heap 1444 MB | GC g1'
