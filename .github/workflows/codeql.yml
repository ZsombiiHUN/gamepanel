name: CodeQL
# Static security analysis of the Go and TypeScript code; findings appear
# under Security → Code scanning. Free for public repositories.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 2" # weekly, to pick up new queries
permissions:
  contents: read
jobs:
  analyze:
    # Code scanning on a private repository needs GitHub Advanced Security, so
    # this runs once the repository is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - internal/web/dist
              - docs/.vitepress/dist
              - "**/node_modules"
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
