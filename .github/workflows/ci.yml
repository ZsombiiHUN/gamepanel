name: CI
# Changes that only touch documentation skip CI (the Docs workflow builds them).
on:
  push:
    branches: [main]
    paths-ignore: [docs/**, "**.md", LICENSE]
  pull_request:
    paths-ignore: [docs/**, "**.md", LICENSE]
permissions:
  contents: read
# A new push to a pull request cancels the run for the older commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    # golangci-lint (.golangci.yml) and known vulnerabilities in reachable code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0 # keep in step with GOLANGCI_LINT in the Makefile
      - run: make vuln
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # setup-go keys its cache on go.sum alone, shared with the e2e and docker-smoke
      # jobs, which build without -race; whichever job saves it first wins. Without
      # -race builds of the dependencies this job compiles them all again (35s on
      # 8 cores, more on a runner), so it keeps a cache of its own.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
      # Race-enabled tests with a coverage floor (COVER_MIN in the Makefile). Vet runs in the lint job.
      - run: make cover
      # The daemon usually runs as root; files it creates must still belong to the game user.
      - name: File ownership as root
        run: sudo -E env "PATH=$PATH" go test -count=1 -run TestRootDaemon -v ./internal/daemon/fsx/
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
  e2e:
    # Real browser against a real panel with a fake daemon: layout, keyboard, search, accessibility.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/e2e/.report
            web/e2e/.results
          retention-days: 7
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash scripts/docker-smoke.sh
  packaging:
    # The release config, the installer and both images still build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/install.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: panel
          cache-from: type=gha,scope=panel
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: daemon
          cache-from: type=gha,scope=daemon
