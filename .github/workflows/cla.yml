name: CLA

# Contributors sign CLA.md once by commenting on their pull request. Signatures
# are kept in signatures/cla.json on the cla-signatures branch of this repo.
on:
  issue_comment:
    types: [created]
  # pull_request_target so it also runs for forks. It never checks out or runs PR code.
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: ZsombiiHUN,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thanks for the pull request. GamePanel is AGPL-3.0 and is also offered
            under commercial licenses, so contributors sign our
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            once. You keep your copyright. To sign, reply with the line below.
